<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighting Fantasy - Interactive Gamebook</title>
    <!-- PDF.js library for PDF parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom right, #fffbeb, #fed7aa);
            min-height: 100vh;
            padding: 2rem;
            color: #1f2937;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: #78350f;
        }

        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #1f2937;
        }

        .button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button-primary {
            background: #10b981;
            color: white;
        }

        .button-primary:hover {
            background: #059669;
        }

        .button-secondary {
            background: #3b82f6;
            color: white;
        }

        .button-secondary:hover {
            background: #2563eb;
        }

        .button-danger {
            background: #ef4444;
            color: white;
        }

        .button-danger:hover {
            background: #dc2626;
        }

        .button-warning {
            background: #f59e0b;
            color: white;
        }

        .button-warning:hover {
            background: #d97706;
        }

        .button-gray {
            background: #6b7280;
            color: white;
        }

        .button-gray:hover {
            background: #4b5563;
        }

        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 0.5rem;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .upload-area.drag-over {
            border-color: #f59e0b;
            background: #fef3c7;
        }

        .choice-button {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background: #fef3c7;
            border: 2px solid #fcd34d;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-button:hover {
            background: #fde68a;
        }

        .stat-bar {
            margin-bottom: 1rem;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .stat-progress {
            width: 100%;
            height: 0.75rem;
            background: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            transition: all 0.3s;
        }

        .stat-fill.high {
            background: #10b981;
        }

        .stat-fill.medium {
            background: #f59e0b;
        }

        .stat-fill.low {
            background: #ef4444;
        }

        .inventory-item {
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 0.5rem;
            border: 2px solid;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .item-weapon {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .item-armor {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .item-potion {
            background: #f3e8ff;
            border-color: #d8b4fe;
        }

        .item-treasure {
            background: #fef3c7;
            border-color: #fcd34d;
        }

        .item-key {
            background: #fed7aa;
            border-color: #fdba74;
        }

        .item-other {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .grid {
            display: grid;
            gap: 1.5rem;
        }

        .grid-cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        @media (max-width: 1024px) {
            .grid-cols-3 {
                grid-template-columns: 1fr;
            }
        }

        .section-text {
            line-height: 1.8;
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
        }

        .combat-log {
            background: #f9fafb;
            border-radius: 0.5rem;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.875rem;
            margin: 1rem 0;
        }

        .dice-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
            background: #f3f4f6;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .dice-roll {
            text-align: center;
        }

        .dice-icon {
            font-size: 3rem;
        }

        .dice-value {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .map-section {
            display: inline-block;
            padding: 0.5rem;
            margin: 0.25rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .map-section.current {
            background: #f59e0b;
            color: white;
        }

        .map-section.visited {
            background: #e5e7eb;
            color: #374151;
        }

        .hidden {
            display: none;
        }

        .flex {
            display: flex;
        }

        .flex-gap {
            gap: 1rem;
        }

        .flex-between {
            justify-content: space-between;
            align-items: center;
        }

        .text-center {
            text-align: center;
        }

        .mb-1 {
            margin-bottom: 0.5rem;
        }

        .mb-2 {
            margin-bottom: 1rem;
        }

        .mt-2 {
            margin-top: 1rem;
        }

        .ending-victory {
            background: #d1fae5;
            border: 2px solid #10b981;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .ending-defeat {
            background: #fee2e2;
            border: 2px solid #ef4444;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .ending-neutral {
            background: #f3f4f6;
            border: 2px solid #6b7280;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .alert-error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        .book-info {
            background: #fef3c7;
            padding: 1.5rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="file"] {
            display: none;
        }

        .remove-item {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            padding: 0 0.5rem;
        }

        .remove-item:hover {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">⚔️ Fighting Fantasy ⚔️</h1>

        <div id="app">
            <!-- Content will be injected here -->
        </div>
    </div>

    <script>
        // Game State Management
        const GameState = {
            currentBook: null,
            isGameStarted: false,
            currentSection: 1,
            stats: null,
            inventory: [],
            visitedSections: new Set(),
            inCombat: false,
            enemyCurrentStamina: 0,
            combatLog: [],

            loadBook(book) {
                this.currentBook = book;
                this.isGameStarted = false;
                // Check if section 0 exists (intro), if so show it first
                const hasIntro = book.sections.some(s => s.id === 0);
                this.currentSection = hasIntro ? 0 : book.startingSection;
                this.stats = null;
                this.inventory = [];
                this.visitedSections = new Set();
                render();
            },

            startGame() {
                if (!this.currentBook) return;

                this.isGameStarted = true;
                this.stats = {
                    skill: this.currentBook.initialStats.skill,
                    stamina: this.currentBook.initialStats.stamina,
                    luck: this.currentBook.initialStats.luck,
                    initialSkill: this.currentBook.initialStats.skill,
                    initialStamina: this.currentBook.initialStats.stamina,
                    initialLuck: this.currentBook.initialStats.luck
                };
                this.inventory = [...(this.currentBook.startingItems || [])];
                this.currentSection = this.currentBook.startingSection;
                this.visitedSections = new Set([this.currentBook.startingSection]);
                render();
            },

            resetGame() {
                this.isGameStarted = false;
                this.currentSection = this.currentBook?.startingSection || 1;
                this.stats = null;
                this.inventory = [];
                this.visitedSections = new Set();
                this.inCombat = false;
                this.enemyCurrentStamina = 0;
                this.combatLog = [];
                render();
            },

            goToSection(sectionId) {
                this.currentSection = sectionId;
                this.visitedSections.add(sectionId);
                this.inCombat = false;
                this.combatLog = [];
                render();
            },

            modifyStats(changes) {
                if (!this.stats) return;
                if (changes.skill) this.stats.skill = Math.max(0, this.stats.skill + changes.skill);
                if (changes.stamina) this.stats.stamina = Math.max(0, this.stats.stamina + changes.stamina);
                if (changes.luck) this.stats.luck = Math.max(0, this.stats.luck + changes.luck);
                render();
            },

            addItem(item) {
                this.inventory.push(item);
                render();
            },

            removeItem(itemId) {
                const index = this.inventory.findIndex(item => item.id === itemId);
                if (index !== -1) {
                    this.inventory.splice(index, 1);
                    render();
                }
            },

            hasItem(itemId) {
                return this.inventory.some(item => item.id === itemId);
            },

            rollDice() {
                return Math.floor(Math.random() * 6) + 1;
            },

            rollTwoDice() {
                return this.rollDice() + this.rollDice();
            },

            testLuck() {
                if (!this.stats) return { success: false, newLuck: 0 };
                const roll = this.rollTwoDice();
                const success = roll <= this.stats.luck;
                this.stats.luck -= 1;
                return { success, newLuck: this.stats.luck };
            },

            saveGame() {
                if (!this.currentBook || !this.stats) return;

                const saveData = {
                    id: `save_${Date.now()}`,
                    timestamp: Date.now(),
                    bookTitle: this.currentBook.title,
                    bookId: this.currentBook.id,
                    currentSection: this.currentSection,
                    stats: this.stats,
                    inventory: this.inventory,
                    visitedSections: Array.from(this.visitedSections)
                };

                const saves = JSON.parse(localStorage.getItem('ff_saves') || '[]');
                saves.push(saveData);
                localStorage.setItem('ff_saves', JSON.stringify(saves));
                alert('Game saved!');
            }
        };

        // Render Functions
        function render() {
            const app = document.getElementById('app');

            if (!GameState.isGameStarted) {
                app.innerHTML = renderBookUploader();
            } else {
                app.innerHTML = renderGameReader();
            }

            attachEventListeners();
        }

        function renderBookUploader() {
            if (!GameState.currentBook) {
                return `
                    <div class="card">
                        <h2 class="card-title text-center">Load Adventure Book</h2>

                        <div class="upload-area" id="upload-area">
                            <input type="file" id="file-input" accept=".json,.txt,.md,.pdf">
                            <label for="file-input" style="cursor: pointer;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">📁</div>
                                <div style="font-size: 1.125rem; margin-bottom: 0.5rem;">Drop your adventure file here</div>
                                <div style="font-size: 0.875rem; color: #6b7280;">Supports JSON, TXT, Markdown, and PDF formats</div>
                                <div style="font-size: 0.875rem; color: #6b7280;">or click to browse</div>
                            </label>
                        </div>

                        <div class="text-center mt-2">
                            <button class="button button-secondary" onclick="loadExampleBook()">
                                Load Example Adventure
                            </button>
                        </div>

                        <div id="error-message"></div>
                    </div>
                `;
            } else {
                const book = GameState.currentBook;
                return `
                    <div class="card">
                        <h2 class="card-title text-center">Load Adventure Book</h2>

                        <div class="book-info">
                            <h3 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem;">${book.title}</h3>
                            ${book.author ? `<p style="color: #6b7280; margin-bottom: 0.5rem;">By ${book.author}</p>` : ''}
                            ${book.description ? `<p style="margin-bottom: 1rem;">${book.description}</p>` : ''}
                            <div style="font-size: 0.875rem; color: #6b7280;">
                                <p>Starting Stats:</p>
                                <ul style="margin-left: 1.5rem; margin-top: 0.5rem;">
                                    <li>SKILL: ${book.initialStats.skill}</li>
                                    <li>STAMINA: ${book.initialStats.stamina}</li>
                                    <li>LUCK: ${book.initialStats.luck}</li>
                                </ul>
                            </div>
                        </div>

                        <div class="flex flex-gap">
                            <button class="button button-primary" style="flex: 1;" onclick="GameState.startGame()">
                                Start Adventure
                            </button>
                            <button class="button button-gray" onclick="GameState.loadBook(null); render();">
                                Choose Different Book
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function renderGameReader() {
            const section = GameState.currentBook.sections.find(s => s.id === GameState.currentSection);
            if (!section) {
                return `<div class="card"><p class="text-center" style="color: #ef4444;">Error: Section ${GameState.currentSection} not found</p></div>`;
            }

            return `
                <div class="card">
                    <div class="flex flex-between mb-2">
                        <h2 class="card-title" style="margin: 0;">${GameState.currentBook.title}</h2>
                        <div class="flex flex-gap">
                            <button class="button button-secondary" onclick="GameState.saveGame()">Save Game</button>
                            <button class="button button-danger" onclick="if(confirm('Restart the adventure?')) GameState.resetGame()">Restart</button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3">
                    <div style="grid-column: span 2;">
                        ${renderSection(section)}
                        ${renderMapTracker()}
                    </div>
                    <div>
                        ${renderCharacterSheet()}
                        ${renderInventory()}
                    </div>
                </div>
            `;
        }

        function renderSection(section) {
            let html = `<div class="card">`;

            // Section 0 is special - it's the intro
            const isIntro = section.id === 0;

            html += `
                <div class="flex flex-between mb-2">
                    <h3 style="font-size: 1.5rem; font-weight: bold; color: #78350f;">${isIntro ? 'Introduction' : `Section ${section.id}`}</h3>
                    ${section.title ? `<span style="font-size: 1.125rem; color: #6b7280;">${section.title}</span>` : ''}
                </div>
                <div class="section-text">${section.text}</div>
            `;

            // If this is section 0 (intro), show "Start Adventure" button
            if (isIntro) {
                html += `
                    <div style="margin-top: 2rem; padding: 1.5rem; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-radius: 0.5rem; border: 2px solid #d97706;">
                        <h4 style="font-weight: bold; margin-bottom: 0.5rem; color: #78350f;">Ready to begin your adventure?</h4>
                        <button class="button button-primary" onclick="GameState.startGame()" style="font-size: 1.125rem; padding: 0.75rem 1.5rem;">
                            ⚔️ Start Adventure
                        </button>
                    </div>
                `;
                html += `</div>`;
                return html;
            }

            if (section.isEnding) {
                const endingClass = section.endingType === 'victory' ? 'ending-victory' :
                                   section.endingType === 'defeat' ? 'ending-defeat' : 'ending-neutral';
                const endingText = section.endingType === 'victory' ? '🎉 Victory!' :
                                  section.endingType === 'defeat' ? '💀 The End' : 'The End';
                html += `<div class="${endingClass}">${endingText}</div>`;
            }

            if (section.combat && !GameState.inCombat) {
                html += renderCombatStart(section.combat);
            } else if (GameState.inCombat && section.combat) {
                html += renderCombat(section.combat);
            }

            if (section.choices && section.choices.length > 0 && !section.combat) {
                html += `<div class="mt-2"><h4 style="font-weight: 600; margin-bottom: 1rem;">What do you do?</h4>`;
                section.choices.forEach((choice, index) => {
                    const disabled = !canMakeChoice(choice);
                    html += `
                        <button class="choice-button" onclick="handleChoice(${choice.targetSection}, ${index})" ${disabled ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>
                            ${choice.text}
                            ${choice.conditions ? `<span style="font-size: 0.875rem; color: #6b7280;"> (requires conditions)</span>` : ''}
                        </button>
                    `;
                });
                html += `</div>`;
            }

            if (section.testLuck) {
                html += `<div style="background: #f3e8ff; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                    <h4 style="font-weight: bold; margin-bottom: 0.5rem;">Test Your Luck!</h4>
                    <button class="button button-warning" onclick="handleLuckTest(${section.id})">Roll the Dice</button>
                </div>`;
            }

            html += `</div>`;
            return html;
        }

        function renderCombatStart(combat) {
            return `
                <div style="background: #fee2e2; border: 2px solid #ef4444; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                    <h3 style="font-size: 1.5rem; font-weight: bold; color: #dc2626; text-align: center; margin-bottom: 1rem;">
                        ⚔️ Combat Ahead!
                    </h3>
                    <p style="text-align: center; font-size: 1.125rem; margin-bottom: 1rem;">
                        ${combat.enemyName} - SKILL ${combat.enemySkill}, STAMINA ${combat.enemyStamina}
                    </p>
                    <button class="button button-danger" style="width: 100%;" onclick="startCombat(${combat.enemyStamina})">
                        Fight!
                    </button>
                </div>
            `;
        }

        function renderCombat(combat) {
            return `
                <div style="background: #fee2e2; border: 2px solid #ef4444; padding: 1.5rem; border-radius: 0.5rem; margin-top: 1rem;">
                    <h3 style="font-size: 1.5rem; font-weight: bold; color: #dc2626; text-align: center; margin-bottom: 0.5rem;">
                        ⚔️ Combat!
                    </h3>
                    <p style="text-align: center; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">
                        ${combat.enemyName}
                    </p>
                    <div class="flex" style="justify-content: center; gap: 2rem; margin-bottom: 1rem;">
                        <div class="text-center">
                            <p style="font-size: 0.875rem; color: #6b7280;">SKILL</p>
                            <p style="font-size: 1.5rem; font-weight: bold;">${combat.enemySkill}</p>
                        </div>
                        <div class="text-center">
                            <p style="font-size: 0.875rem; color: #6b7280;">STAMINA</p>
                            <p style="font-size: 1.5rem; font-weight: bold; color: ${GameState.enemyCurrentStamina <= combat.enemyStamina / 3 ? '#ef4444' : '#1f2937'};">
                                ${GameState.enemyCurrentStamina}
                            </p>
                        </div>
                    </div>

                    <div class="combat-log">
                        ${GameState.combatLog.map(log => `<div>${log}</div>`).join('')}
                    </div>

                    <div class="flex flex-gap">
                        <button class="button button-danger" style="flex: 1;" onclick="fightRound()">
                            Fight Round
                        </button>
                        ${combat.canFlee ? `<button class="button button-warning" onclick="fleeCombat(${combat.fleeSection})">Flee</button>` : ''}
                    </div>
                </div>
            `;
        }

        function renderCharacterSheet() {
            if (!GameState.stats) return '';

            return `
                <div class="card">
                    <h3 class="card-title" style="border-bottom: 2px solid #f59e0b; padding-bottom: 0.5rem;">
                        Character Stats
                    </h3>
                    ${renderStatBar('SKILL', GameState.stats.skill, GameState.stats.initialSkill)}
                    ${renderStatBar('STAMINA', GameState.stats.stamina, GameState.stats.initialStamina)}
                    ${renderStatBar('LUCK', GameState.stats.luck, GameState.stats.initialLuck)}
                </div>
            `;
        }

        function renderStatBar(label, current, initial) {
            const percentage = Math.min(100, Math.max(0, (current / initial) * 100));
            const colorClass = percentage > 66 ? 'high' : percentage > 33 ? 'medium' : 'low';
            const color = percentage > 66 ? '#10b981' : percentage > 33 ? '#f59e0b' : '#ef4444';

            return `
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>${label}</span>
                        <span style="color: ${color}; font-size: 1.125rem;">${current} / ${initial}</span>
                    </div>
                    <div class="stat-progress">
                        <div class="stat-fill ${colorClass}" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        }

        function renderInventory() {
            const icons = {
                weapon: '⚔️',
                armor: '🛡️',
                potion: '🧪',
                treasure: '💎',
                key: '🔑',
                other: '📦'
            };

            let html = `
                <div class="card">
                    <h3 class="card-title" style="border-bottom: 2px solid #f59e0b; padding-bottom: 0.5rem;">
                        Inventory
                    </h3>
            `;

            if (GameState.inventory.length === 0) {
                html += `<p class="text-center" style="color: #6b7280; padding: 2rem 0;">Your inventory is empty</p>`;
            } else {
                GameState.inventory.forEach((item, index) => {
                    const itemClass = `item-${item.type || 'other'}`;
                    html += `
                        <div class="inventory-item ${itemClass}">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                                    <span style="font-size: 1.5rem;">${icons[item.type] || icons.other}</span>
                                    <strong>${item.name}</strong>
                                </div>
                                ${item.description ? `<div style="font-size: 0.875rem; color: #6b7280; margin-left: 2rem;">${item.description}</div>` : ''}
                            </div>
                            <span class="remove-item" onclick="GameState.removeItem('${item.id}')" title="Remove item">✕</span>
                        </div>
                    `;
                });
            }

            html += `
                    <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; font-size: 0.875rem; color: #6b7280;">
                        Items: ${GameState.inventory.length}
                    </div>
                </div>
            `;

            return html;
        }

        function renderMapTracker() {
            const sorted = Array.from(GameState.visitedSections).sort((a, b) => a - b);
            const recent = sorted.slice(-10);

            return `
                <div class="card">
                    <h3 class="card-title" style="border-bottom: 2px solid #f59e0b; padding-bottom: 0.5rem;">
                        Journey Map
                    </h3>
                    <div class="mb-2">
                        <p style="font-size: 0.875rem; color: #6b7280;">Sections visited: ${GameState.visitedSections.size}</p>
                        <p style="font-size: 0.875rem; color: #6b7280;">Current: Section ${GameState.currentSection}</p>
                    </div>
                    <div style="margin-top: 1rem;">
                        <h4 style="font-size: 0.875rem; font-weight: 600; color: #6b7280; margin-bottom: 0.5rem;">Recent Path:</h4>
                        <div style="display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center;">
                            ${recent.map((id, index) => `
                                <span class="map-section ${id === GameState.currentSection ? 'current' : 'visited'}">
                                    ${id}
                                </span>
                                ${index < recent.length - 1 ? '<span style="color: #9ca3af;">→</span>' : ''}
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Event Handlers
        function attachEventListeners() {
            const fileInput = document.getElementById('file-input');
            if (fileInput) {
                fileInput.addEventListener('change', handleFileSelect);
            }

            const uploadArea = document.getElementById('upload-area');
            if (uploadArea) {
                uploadArea.addEventListener('dragenter', handleDrag);
                uploadArea.addEventListener('dragover', handleDrag);
                uploadArea.addEventListener('dragleave', handleDragLeave);
                uploadArea.addEventListener('drop', handleDrop);
            }
        }

        function handleDrag(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('drag-over');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        async function handleFile(file) {
            const fileName = file.name.toLowerCase();

            try {
                if (fileName.endsWith('.json')) {
                    await handleJSONFile(file);
                } else if (fileName.endsWith('.txt') || fileName.endsWith('.md')) {
                    await handleTextFile(file);
                } else if (fileName.endsWith('.pdf')) {
                    await handlePDFFile(file);
                } else {
                    showError('Unsupported file format. Please upload JSON, TXT, MD, or PDF files.');
                }
            } catch (err) {
                showError('Error loading file: ' + err.message);
            }
        }

        function handleJSONFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (validateBook(data)) {
                            GameState.loadBook(data);
                            resolve();
                        } else {
                            showError('Invalid book format. Please check the JSON structure.');
                            reject(new Error('Invalid format'));
                        }
                    } catch (err) {
                        showError('Error parsing JSON file: ' + err.message);
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        function handleTextFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const book = parseTextAdventure(text);
                        if (validateBook(book)) {
                            GameState.loadBook(book);
                            resolve();
                        } else {
                            showError('Could not parse adventure from text file. Please check the format.');
                            reject(new Error('Invalid format'));
                        }
                    } catch (err) {
                        showError('Error parsing text file: ' + err.message);
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        async function handlePDFFile(file) {
            if (typeof pdfjsLib === 'undefined') {
                showError('PDF.js library not loaded. Cannot parse PDF files.');
                throw new Error('PDF.js not available');
            }

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();

                // Improved text extraction that preserves line breaks
                let pageText = '';
                let lastY = null;

                for (let j = 0; j < textContent.items.length; j++) {
                    const item = textContent.items[j];
                    const text = item.str;

                    // Get Y coordinate from transform matrix
                    const currentY = item.transform[5];

                    // Add newline if we're on a different line (Y coordinate changed significantly)
                    if (lastY !== null && Math.abs(currentY - lastY) > 5) {
                        pageText += '\n';
                    } else if (pageText.length > 0 && !pageText.endsWith(' ') && !pageText.endsWith('\n')) {
                        // Add space between items on the same line
                        pageText += ' ';
                    }

                    pageText += text;
                    lastY = currentY;
                }

                fullText += pageText + '\n\n';
            }

            // Try to parse as JSON first (in case PDF contains JSON data)
            try {
                const data = JSON.parse(fullText);
                if (validateBook(data)) {
                    GameState.loadBook(data);
                    return;
                }
            } catch (e) {
                // Not JSON, try text parsing
            }

            // Parse as text adventure
            const book = parseTextAdventure(fullText);
            if (validateBook(book)) {
                GameState.loadBook(book);
            } else {
                showError('Could not parse adventure from PDF. Please ensure it follows the text format.');
                throw new Error('Invalid format');
            }
        }

        function parseTextAdventure(text) {
            // Parse text-based adventure format
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);

            // Extract metadata
            let title = 'Untitled Adventure';
            let author = '';
            let description = '';
            let skill = 8, stamina = 20, luck = 9;

            // Look for metadata at the start
            const titleMatch = text.match(/(?:Title|TITLE|Adventure):\s*(.+)/i);
            if (titleMatch) title = titleMatch[1].trim();

            const authorMatch = text.match(/(?:Author|By):\s*(.+)/i);
            if (authorMatch) author = authorMatch[1].trim();

            const descMatch = text.match(/(?:Description|Summary):\s*(.+)/i);
            if (descMatch) description = descMatch[1].trim();

            const skillMatch = text.match(/(?:Initial\s+)?SKILL:\s*(\d+)/i);
            if (skillMatch) skill = parseInt(skillMatch[1]);

            const staminaMatch = text.match(/(?:Initial\s+)?STAMINA:\s*(\d+)/i);
            if (staminaMatch) stamina = parseInt(staminaMatch[1]);

            const luckMatch = text.match(/(?:Initial\s+)?LUCK:\s*(\d+)/i);
            if (luckMatch) luck = parseInt(luckMatch[1]);

            // Parse sections
            const sections = [];
            // Enhanced regex to handle PDF text variations:
            // - "Section 1:" or "SECTION 1:"
            // - "[1]" or "(1)"
            // - "1." or "1:" at start of line (common in PDF Fighting Fantasy books)
            const sectionRegex = /(?:(?:Section|SECTION)\s*(\d+)\s*(?:\]|:|\.|–|—)|\[(\d+)\]|\((\d+)\)|^(\d+)[\.:]\s)/gim;
            const matches = [];
            let match;

            while ((match = sectionRegex.exec(text)) !== null) {
                // Find which capture group matched (we have 4 possible patterns)
                const sectionId = parseInt(match[1] || match[2] || match[3] || match[4]);
                matches.push({
                    id: sectionId,
                    start: match.index,
                    headerEnd: match.index + match[0].length
                });
            }

            // Extract section content
            for (let i = 0; i < matches.length; i++) {
                const current = matches[i];
                const next = matches[i + 1];
                const endPos = next ? next.start : text.length;

                let sectionText = text.substring(current.headerEnd, endPos).trim();

                // Parse section title (optional line after section number)
                let sectionTitle = '';
                const titleLineMatch = sectionText.match(/^([^\n]+)\n/);
                if (titleLineMatch && titleLineMatch[1].length < 80 && !titleLineMatch[1].match(/turn to|go to|if you|you are/i)) {
                    sectionTitle = titleLineMatch[1].trim();
                    sectionText = sectionText.substring(titleLineMatch[0].length).trim();
                }

                const section = {
                    id: current.id,
                    title: sectionTitle,
                    text: '',
                    choices: []
                };

                // Extract combat encounters
                const combatMatch = sectionText.match(/(?:SKILL|Skill)\s+(\d+)(?:,|\s+)(?:STAMINA|Stamina)\s+(\d+)/i);
                if (combatMatch) {
                    const enemyNameMatch = sectionText.match(/(?:fight|battle|encounter|combat|face)(?:\s+the|\s+a|\s+an)?\s+([A-Z\s]+?)(?=\s+SKILL|\s+Skill|\.|,)/i);
                    section.combat = {
                        enemyName: enemyNameMatch ? enemyNameMatch[1].trim() : 'Enemy',
                        enemySkill: parseInt(combatMatch[1]),
                        enemyStamina: parseInt(combatMatch[2]),
                        onVictorySection: current.id + 1,
                        onDefeatSection: 999
                    };
                }

                // Extract choices - look for "turn to", "go to", "proceed to" followed by section numbers
                const choiceRegex = /(?:turn|go|proceed|move|continue|head|return)(?:\s+(?:to|back to|forward to))?\s+(?:section\s+)?(\d+)/gi;
                const choiceMatches = [...sectionText.matchAll(choiceRegex)];

                if (choiceMatches.length > 0) {
                    const seenTargets = new Set();
                    choiceMatches.forEach((m, idx) => {
                        const targetSection = parseInt(m[1]);
                        if (!seenTargets.has(targetSection)) {
                            seenTargets.add(targetSection);

                            // Extract choice text (sentence containing the reference)
                            const sentenceStart = Math.max(0, m.index - 100);
                            const sentenceEnd = Math.min(sectionText.length, m.index + m[0].length + 50);
                            let choiceText = sectionText.substring(sentenceStart, sentenceEnd);

                            // Clean up choice text
                            const sentenceMatch = choiceText.match(/[.!?]\s*([^.!?]+)/);
                            if (sentenceMatch) {
                                choiceText = sentenceMatch[1].trim();
                            }
                            choiceText = choiceText.replace(/^\W+|\W+$/g, '').trim();

                            if (!choiceText || choiceText.length > 200) {
                                choiceText = `Go to section ${targetSection}`;
                            }

                            section.choices.push({
                                text: choiceText,
                                targetSection: targetSection
                            });
                        }
                    });
                }

                // Extract main narrative text (remove combat info and choice markers)
                let narrativeText = sectionText
                    .replace(/(?:SKILL|Skill)\s+\d+(?:,|\s+)(?:STAMINA|Stamina)\s+\d+/gi, '')
                    .replace(/(?:turn|go|proceed)\s+to\s+(?:section\s+)?\d+/gi, '')
                    .trim();

                // Check for endings
                const endingMatch = narrativeText.match(/(?:you have won|victory|you have succeeded|the end|you have died|you are dead|game over)/i);
                if (endingMatch || current.id === 999 || current.id === 400) {
                    section.isEnding = true;
                    section.endingType = narrativeText.match(/(?:you have won|victory|succeeded)/i) ? 'victory' :
                                        narrativeText.match(/(?:died|dead|game over)/i) ? 'defeat' : 'neutral';
                }

                section.text = narrativeText;

                // If no choices and not an ending, link to next section
                if (section.choices.length === 0 && !section.isEnding && !section.combat) {
                    if (i < matches.length - 1) {
                        section.choices.push({
                            text: 'Continue',
                            targetSection: matches[i + 1].id
                        });
                    }
                }

                sections.push(section);
            }

            // If no sections found, create a simple single-section adventure
            if (sections.length === 0) {
                sections.push({
                    id: 1,
                    title: 'Start',
                    text: text.substring(0, 1000),
                    choices: [],
                    isEnding: true,
                    endingType: 'neutral'
                });
            }

            // Determine starting section: prefer section 1 (adventure start), skip section 0 (intro)
            let startingSection = 1;
            const section1 = sections.find(s => s.id === 1);
            if (section1) {
                startingSection = 1;
            } else {
                // If no section 1, find first section with id > 0 (skip intro)
                const firstNonIntro = sections.find(s => s.id > 0);
                startingSection = firstNonIntro?.id || 1;
            }

            return {
                id: title.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, ''),
                title: title,
                author: author,
                description: description,
                startingSection: startingSection,
                initialStats: { skill, stamina, luck },
                startingItems: [],
                sections: sections
            };
        }

        function validateBook(book) {
            return book.id && book.title && book.sections &&
                   Array.isArray(book.sections) && book.sections.length > 0 &&
                   book.initialStats;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) {
                errorDiv.innerHTML = `<div class="alert-error">${message}</div>`;
                setTimeout(() => {
                    errorDiv.innerHTML = '';
                }, 5000);
            }
        }

        function loadExampleBook() {
            fetch('example-adventure.json')
                .then(res => res.json())
                .then(data => {
                    if (validateBook(data)) {
                        GameState.loadBook(data);
                    } else {
                        showError('Example book has invalid format');
                    }
                })
                .catch(err => {
                    showError('Could not load example book. Make sure example-adventure.json is in the same directory as this HTML file.');
                });
        }

        function canMakeChoice(choice) {
            if (!choice.conditions) return true;

            const c = choice.conditions;
            if (c.requiresItem && !GameState.hasItem(c.requiresItem)) return false;
            if (c.requiresMinSkill && GameState.stats.skill < c.requiresMinSkill) return false;
            if (c.requiresMinStamina && GameState.stats.stamina < c.requiresMinStamina) return false;
            if (c.requiresMinLuck && GameState.stats.luck < c.requiresMinLuck) return false;

            return true;
        }

        function handleChoice(targetSection, choiceIndex) {
            const section = GameState.currentBook.sections.find(s => s.id === GameState.currentSection);
            const choice = section.choices[choiceIndex];

            if (!canMakeChoice(choice)) {
                alert('You do not meet the requirements for this choice.');
                return;
            }

            // Apply section effects before moving
            const nextSection = GameState.currentBook.sections.find(s => s.id === targetSection);
            if (nextSection) {
                if (nextSection.modifyStats) {
                    GameState.modifyStats(nextSection.modifyStats);
                }
                if (nextSection.addItems) {
                    nextSection.addItems.forEach(item => GameState.addItem(item));
                }
                if (nextSection.removeItems) {
                    nextSection.removeItems.forEach(itemId => GameState.removeItem(itemId));
                }
            }

            GameState.goToSection(targetSection);
        }

        function handleLuckTest(sectionId) {
            const section = GameState.currentBook.sections.find(s => s.id === sectionId);
            if (!section || !section.testLuck) return;

            const result = GameState.testLuck();
            const message = result.success ?
                `Lucky! You rolled successfully. ${section.testLuck.successText || ''}` :
                `Unlucky! You failed the luck test. ${section.testLuck.failureText || ''}`;

            alert(message);

            const nextSection = result.success ?
                section.testLuck.successSection :
                section.testLuck.failureSection;

            if (nextSection) {
                setTimeout(() => GameState.goToSection(nextSection), 500);
            } else {
                render();
            }
        }

        function startCombat(enemyStamina) {
            const section = GameState.currentBook.sections.find(s => s.id === GameState.currentSection);
            GameState.inCombat = true;
            GameState.enemyCurrentStamina = enemyStamina;
            GameState.combatLog = [
                `⚔️ Combat begins with ${section.combat.enemyName}!`,
                `${section.combat.enemyName}: SKILL ${section.combat.enemySkill}, STAMINA ${section.combat.enemyStamina}`
            ];
            render();
        }

        function fightRound() {
            const section = GameState.currentBook.sections.find(s => s.id === GameState.currentSection);
            if (!section || !section.combat || !GameState.stats) return;

            const combat = section.combat;

            // Roll for player
            const playerDice = GameState.rollTwoDice();
            const playerAttackStrength = playerDice + GameState.stats.skill;

            // Roll for enemy
            const enemyDice = GameState.rollTwoDice();
            const enemyAttackStrength = enemyDice + combat.enemySkill;

            const roundNum = GameState.combatLog.filter(l => l.includes('Round')).length + 1;
            GameState.combatLog.push(`\nRound ${roundNum}:`);
            GameState.combatLog.push(`You rolled ${playerDice} + ${GameState.stats.skill} SKILL = ${playerAttackStrength}`);
            GameState.combatLog.push(`${combat.enemyName} rolled ${enemyDice} + ${combat.enemySkill} SKILL = ${enemyAttackStrength}`);

            if (playerAttackStrength > enemyAttackStrength) {
                // Player wins
                GameState.enemyCurrentStamina -= 2;
                GameState.combatLog.push(`💥 You hit ${combat.enemyName} for 2 damage! (${GameState.enemyCurrentStamina} STAMINA remaining)`);

                if (GameState.enemyCurrentStamina <= 0) {
                    GameState.combatLog.push(`\n🎉 You defeated ${combat.enemyName}!`);
                    GameState.inCombat = false;
                    setTimeout(() => {
                        if (combat.onVictorySection) {
                            GameState.goToSection(combat.onVictorySection);
                        }
                    }, 2000);
                }
            } else if (enemyAttackStrength > playerAttackStrength) {
                // Enemy wins
                GameState.modifyStats({ stamina: -2 });
                GameState.combatLog.push(`💔 ${combat.enemyName} hits you for 2 damage!`);

                if (GameState.stats.stamina <= 0) {
                    GameState.combatLog.push(`\n💀 You have been defeated...`);
                    GameState.inCombat = false;
                    setTimeout(() => {
                        if (combat.onDefeatSection) {
                            GameState.goToSection(combat.onDefeatSection);
                        }
                    }, 2000);
                    return;
                }
            } else {
                // Tie
                GameState.combatLog.push(`⚡ Your blows meet! No damage dealt.`);
            }

            render();
        }

        function fleeCombat(fleeSection) {
            const section = GameState.currentBook.sections.find(s => s.id === GameState.currentSection);
            GameState.combatLog.push(`\n🏃 You flee from ${section.combat.enemyName}!`);
            GameState.inCombat = false;
            setTimeout(() => GameState.goToSection(fleeSection), 1000);
        }

        // Initialize
        render();
    </script>
