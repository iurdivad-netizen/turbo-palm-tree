<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighting Fantasy - Interactive Gamebook</title>
    <!-- PDF.js library for PDF parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom right, #fffbeb, #fed7aa);
            min-height: 100vh;
            padding: 2rem;
            color: #1f2937;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: #78350f;
        }

        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #1f2937;
        }

        .button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button-primary {
            background: #10b981;
            color: white;
        }

        .button-primary:hover {
            background: #059669;
        }

        .button-secondary {
            background: #3b82f6;
            color: white;
        }

        .button-secondary:hover {
            background: #2563eb;
        }

        .button-danger {
            background: #ef4444;
            color: white;
        }

        .button-danger:hover {
            background: #dc2626;
        }

        .button-warning {
            background: #f59e0b;
            color: white;
        }

        .button-warning:hover {
            background: #d97706;
        }

        .button-gray {
            background: #6b7280;
            color: white;
        }

        .button-gray:hover {
            background: #4b5563;
        }

        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 0.5rem;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .upload-area.drag-over {
            border-color: #f59e0b;
            background: #fef3c7;
        }

        .choice-button {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background: #fef3c7;
            border: 2px solid #fcd34d;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-button:hover {
            background: #fde68a;
        }

        .stat-bar {
            margin-bottom: 1rem;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .stat-progress {
            width: 100%;
            height: 0.75rem;
            background: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            transition: all 0.3s;
        }

        .stat-fill.high {
            background: #10b981;
        }

        .stat-fill.medium {
            background: #f59e0b;
        }

        .stat-fill.low {
            background: #ef4444;
        }

        .inventory-item {
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 0.5rem;
            border: 2px solid;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .item-weapon {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .item-armor {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .item-potion {
            background: #f3e8ff;
            border-color: #d8b4fe;
        }

        .item-treasure {
            background: #fef3c7;
            border-color: #fcd34d;
        }

        .item-key {
            background: #fed7aa;
            border-color: #fdba74;
        }

        .item-other {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .grid {
            display: grid;
            gap: 1.5rem;
        }

        .grid-cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        @media (max-width: 1024px) {
            .grid-cols-3 {
                grid-template-columns: 1fr;
            }
        }

        .section-text {
            line-height: 1.8;
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
        }

        .combat-log {
            background: #f9fafb;
            border-radius: 0.5rem;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.875rem;
            margin: 1rem 0;
        }

        .dice-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
            background: #f3f4f6;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .dice-roll {
            text-align: center;
        }

        .dice-icon {
            font-size: 3rem;
        }

        .dice-value {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .map-section {
            display: inline-block;
            padding: 0.5rem;
            margin: 0.25rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .map-section.current {
            background: #f59e0b;
            color: white;
        }

        .map-section.visited {
            background: #e5e7eb;
            color: #374151;
        }

        .hidden {
            display: none;
        }

        .flex {
            display: flex;
        }

        .flex-gap {
            gap: 1rem;
        }

        .flex-between {
            justify-content: space-between;
            align-items: center;
        }

        .text-center {
            text-align: center;
        }

        .mb-1 {
            margin-bottom: 0.5rem;
        }

        .mb-2 {
            margin-bottom: 1rem;
        }

        .mt-2 {
            margin-top: 1rem;
        }

        .ending-victory {
            background: #d1fae5;
            border: 2px solid #10b981;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .ending-defeat {
            background: #fee2e2;
            border: 2px solid #ef4444;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .ending-neutral {
            background: #f3f4f6;
            border: 2px solid #6b7280;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .alert-error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        .book-info {
            background: #fef3c7;
            padding: 1.5rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="file"] {
            display: none;
        }

        .remove-item {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            padding: 0 0.5rem;
        }

        .remove-item:hover {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">⚔️ Fighting Fantasy ⚔️</h1>

        <div id="app">
            <!-- Content will be injected here -->
        </div>
    </div>

    <script>
        // Game State Management
        const GameState = {
            currentBook: null,
            isGameStarted: false,
            currentSection: 1,
            stats: null,
            inventory: [],
            visitedSections: new Set(),
            inCombat: false,
            enemyCurrentStamina: 0,
            combatLog: [],
            currentCombatIndex: 0,

            loadBook(book) {
                this.currentBook = book;
                this.isGameStarted = false;
                // Check if section 0 exists (intro), if so show it first
                const hasIntro = book.sections.some(s => s.id === 0);
                this.currentSection = hasIntro ? 0 : book.startingSection;
                this.stats = null;
                this.inventory = [];
                this.visitedSections = new Set();
                render();
            },

            startGame() {
                if (!this.currentBook) return;

                this.isGameStarted = true;
                this.stats = {
                    skill: this.currentBook.initialStats.skill,
                    stamina: this.currentBook.initialStats.stamina,
                    luck: this.currentBook.initialStats.luck,
                    initialSkill: this.currentBook.initialStats.skill,
                    initialStamina: this.currentBook.initialStats.stamina,
                    initialLuck: this.currentBook.initialStats.luck
                };

                // Set up starting inventory - if no starting items specified, provide default equipment
                const bookStartingItems = this.currentBook.startingItems || [];
                if (bookStartingItems.length === 0) {
                    // Default starting equipment: sword, shield, backpack, and 10 rations
                    this.inventory = [
                        { id: 'sword', name: 'Sword', type: 'weapon' },
                        { id: 'shield', name: 'Shield', type: 'armor' },
                        { id: 'backpack', name: 'Backpack', type: 'other' },
                        // 10 rations, each providing +4 STAMINA (capped at maximum)
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' },
                        { id: 'rations', name: 'Rations', type: 'food', restore: '+4 stamina' }
                    ];
                } else {
                    this.inventory = [...bookStartingItems];
                }

                this.currentSection = this.currentBook.startingSection;
                this.visitedSections = new Set([this.currentBook.startingSection]);
                render();
            },

            resetGame() {
                this.isGameStarted = false;
                this.currentSection = this.currentBook?.startingSection || 1;
                this.stats = null;
                this.inventory = [];
                this.visitedSections = new Set();
                this.inCombat = false;
                this.enemyCurrentStamina = 0;
                this.combatLog = [];
                render();
            },

            goToSection(sectionId) {
                this.currentSection = sectionId;
                this.visitedSections.add(sectionId);
                this.inCombat = false;
                this.combatLog = [];
                this.currentCombatIndex = 0;
                render();
            },

            modifyStats(changes) {
                if (!this.stats) return;
                if (changes.skill) this.stats.skill = Math.max(0, Math.min(this.stats.initialSkill, this.stats.skill + changes.skill));
                if (changes.stamina) this.stats.stamina = Math.max(0, Math.min(this.stats.initialStamina, this.stats.stamina + changes.stamina));
                if (changes.luck) this.stats.luck = Math.max(0, Math.min(this.stats.initialLuck, this.stats.luck + changes.luck));
                render();
            },

            addItem(item) {
                this.inventory.push(item);
                render();
            },

            removeItem(itemId) {
                const index = this.inventory.findIndex(item => item.id === itemId);
                if (index !== -1) {
                    this.inventory.splice(index, 1);
                    render();
                }
            },

            hasItem(itemId) {
                return this.inventory.some(item => item.id === itemId);
            },

            rollDice() {
                return Math.floor(Math.random() * 6) + 1;
            },

            rollTwoDice() {
                return this.rollDice() + this.rollDice();
            },

            testLuck() {
                if (!this.stats) return { success: false, newLuck: 0 };
                const roll = this.rollTwoDice();
                const success = roll <= this.stats.luck;
                this.stats.luck -= 1;
                return { success, newLuck: this.stats.luck };
            },

            // Calculate total attack bonus from weapons in inventory
            calculateAttackBonus() {
                return this.inventory.reduce((total, item) => {
                    if (item.type === 'weapon' && item.bonus) {
                        // Extract numeric bonus from strings like "+1 skill", "+2 attack", etc.
                        const match = item.bonus.match(/([+-]\d+)/);
                        if (match) {
                            return total + parseInt(match[1]);
                        }
                    }
                    return total;
                }, 0);
            },

            // Calculate total defense bonus from armor in inventory
            calculateDefenseBonus() {
                return this.inventory.reduce((total, item) => {
                    if (item.type === 'armor' && item.bonus) {
                        // Extract numeric bonus from strings like "+1 defense", "+2 armor", etc.
                        const match = item.bonus.match(/([+-]\d+)/);
                        if (match) {
                            return total + parseInt(match[1]);
                        }
                    }
                    return total;
                }, 0);
            },

            // Use an item from inventory (e.g., healing potion, ration)
            useItem(itemId) {
                const item = this.inventory.find(i => i.id === itemId);
                if (!item || !item.restore) return;

                // Parse the restore property (e.g., "+4 stamina", "+2 skill", "+1 luck")
                const restoreMatch = item.restore.match(/([+-]\d+)\s*(\w+)/);
                if (restoreMatch) {
                    const amount = parseInt(restoreMatch[1]);
                    const stat = restoreMatch[2].toLowerCase();

                    // Apply the restoration
                    if (stat === 'stamina' || stat === 'skill' || stat === 'luck') {
                        const changes = {};
                        changes[stat] = amount;
                        this.modifyStats(changes);

                        // Show feedback message
                        alert(`You used ${item.name}! ${amount >= 0 ? '+' : ''}${amount} ${stat.toUpperCase()}`);

                        // Remove consumable items after use
                        if (item.type === 'potion' || item.type === 'food') {
                            this.removeItem(itemId);
                        }
                    }
                }
            },

            saveGame() {
                if (!this.currentBook || !this.stats) return;

                const saveData = {
                    id: `save_${Date.now()}`,
                    timestamp: Date.now(),
                    bookTitle: this.currentBook.title,
                    bookId: this.currentBook.id,
                    currentSection: this.currentSection,
                    stats: this.stats,
                    inventory: this.inventory,
                    visitedSections: Array.from(this.visitedSections)
                };

                const saves = JSON.parse(localStorage.getItem('ff_saves') || '[]');
                saves.push(saveData);
                localStorage.setItem('ff_saves', JSON.stringify(saves));
                alert('Game saved!');
            }
        };

        // Render Functions
        function render() {
            const app = document.getElementById('app');

            if (!GameState.isGameStarted) {
                app.innerHTML = renderBookUploader();
            } else {
                app.innerHTML = renderGameReader();
            }

            attachEventListeners();
        }

        function renderBookUploader() {
            if (!GameState.currentBook) {
                return `
                    <div class="card">
                        <h2 class="card-title text-center">Load Adventure Book</h2>

                        <div class="upload-area" id="upload-area">
                            <input type="file" id="file-input" accept=".json,.txt,.md,.pdf">
                            <label for="file-input" style="cursor: pointer;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">📁</div>
                                <div style="font-size: 1.125rem; margin-bottom: 0.5rem;">Drop your adventure file here</div>
                                <div style="font-size: 0.875rem; color: #6b7280;">Supports JSON, TXT, Markdown, and PDF formats</div>
                                <div style="font-size: 0.875rem; color: #6b7280;">or click to browse</div>
                            </label>
                        </div>

                        <div class="text-center mt-2">
                            <button class="button button-secondary" onclick="loadExampleBook()">
                                Load Example Adventure
                            </button>
                        </div>

                        <div id="error-message"></div>
                    </div>
                `;
            } else {
                const book = GameState.currentBook;
                return `
                    <div class="card">
                        <h2 class="card-title text-center">Load Adventure Book</h2>

                        <div class="book-info">
                            <h3 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem;">${book.title}</h3>
                            ${book.author ? `<p style="color: #6b7280; margin-bottom: 0.5rem;">By ${book.author}</p>` : ''}
                            ${book.description ? `<p style="margin-bottom: 1rem;">${book.description}</p>` : ''}
                            <div style="font-size: 0.875rem; color: #6b7280;">
                                <p>Starting Stats:</p>
                                <ul style="margin-left: 1.5rem; margin-top: 0.5rem;">
                                    <li>SKILL: ${book.initialStats.skill}</li>
                                    <li>STAMINA: ${book.initialStats.stamina}</li>
                                    <li>LUCK: ${book.initialStats.luck}</li>
                                </ul>
                            </div>
                        </div>

                        <div class="flex flex-gap">
                            <button class="button button-primary" style="flex: 1;" onclick="GameState.startGame()">
                                Start Adventure
                            </button>
                            <button class="button button-gray" onclick="GameState.loadBook(null); render();">
                                Choose Different Book
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function renderGameReader() {
            const section = GameState.currentBook.sections.find(s => s.id === GameState.currentSection);
            if (!section) {
                return `<div class="card"><p class="text-center" style="color: #ef4444;">Error: Section ${GameState.currentSection} not found</p></div>`;
            }

            return `
                <div class="card">
                    <div class="flex flex-between mb-2">
                        <h2 class="card-title" style="margin: 0;">${GameState.currentBook.title}</h2>
                        <div class="flex flex-gap">
                            <button class="button button-secondary" onclick="GameState.saveGame()">Save Game</button>
                            <button class="button button-danger" onclick="if(confirm('Restart the adventure?')) GameState.resetGame()">Restart</button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3">
                    <div style="grid-column: span 2;">
                        ${renderSection(section)}
                        ${renderMapTracker()}
                    </div>
                    <div>
                        ${renderCharacterSheet()}
                        ${renderInventory()}
                    </div>
                </div>
            `;
        }

        function renderSection(section) {
            let html = `<div class="card">`;

            // Section 0 is special - it's the intro
            const isIntro = section.id === 0;

            html += `
                <div class="flex flex-between mb-2">
                    <h3 style="font-size: 1.5rem; font-weight: bold; color: #78350f;">${isIntro ? 'Introduction' : `Section ${section.id}`}</h3>
                    ${section.title ? `<span style="font-size: 1.125rem; color: #6b7280;">${section.title}</span>` : ''}
                </div>
                <div class="section-text">${section.text}</div>
            `;

            // If this is section 0 (intro), show "Start Adventure" button
            if (isIntro) {
                html += `
                    <div style="margin-top: 2rem; padding: 1.5rem; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-radius: 0.5rem; border: 2px solid #d97706;">
                        <h4 style="font-weight: bold; margin-bottom: 0.5rem; color: #78350f;">Ready to begin your adventure?</h4>
                        <button class="button button-primary" onclick="GameState.startGame()" style="font-size: 1.125rem; padding: 0.75rem 1.5rem;">
                            ⚔️ Start Adventure
                        </button>
                    </div>
                `;
                html += `</div>`;
                return html;
            }

            if (section.isEnding) {
                const endingClass = section.endingType === 'victory' ? 'ending-victory' :
                                   section.endingType === 'defeat' ? 'ending-defeat' : 'ending-neutral';
                const endingText = section.endingType === 'victory' ? '🎉 Victory!' :
                                  section.endingType === 'defeat' ? '💀 The End' : 'The End';
                html += `<div class="${endingClass}">${endingText}</div>`;
            }

            if (section.combat && !GameState.inCombat) {
                html += renderCombatStart(section.combat);
            } else if (GameState.inCombat && section.combat) {
                html += renderCombat(section.combat);
            }

            if (section.choices && section.choices.length > 0 && !section.combat) {
                html += `<div class="mt-2"><h4 style="font-weight: 600; margin-bottom: 1rem;">What do you do?</h4>`;
                section.choices.forEach((choice, index) => {
                    const disabled = !canMakeChoice(choice);
                    html += `
                        <button class="choice-button" onclick="handleChoice(${choice.targetSection}, ${index})" ${disabled ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>
                            ${choice.text}
                            ${choice.conditions ? `<span style="font-size: 0.875rem; color: #6b7280;"> (requires conditions)</span>` : ''}
                        </button>
                    `;
                });
                html += `</div>`;
            }

            if (section.testLuck) {
                html += `<div style="background: #f3e8ff; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                    <h4 style="font-weight: bold; margin-bottom: 0.5rem;">Test Your Luck!</h4>
                    <button class="button button-warning" onclick="handleLuckTest(${section.id})">Roll the Dice</button>
                </div>`;
            }

            html += `</div>`;
            return html;
        }

        function renderCombatStart(combat) {
            // Handle both single combat and arrays of combats
            const combats = Array.isArray(combat) ? combat : [combat];
            const currentCombat = combats[GameState.currentCombatIndex] || combats[0];

            let html = `
                <div style="background: #fee2e2; border: 2px solid #ef4444; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                    <h3 style="font-size: 1.5rem; font-weight: bold; color: #dc2626; text-align: center; margin-bottom: 1rem;">
                        ⚔️ Combat Ahead!
                    </h3>`;

            // Show all enemies if multiple
            if (combats.length > 1) {
                html += `<p style="text-align: center; font-size: 0.875rem; color: #6b7280; margin-bottom: 0.5rem;">
                    Multiple Enemies! Fight them one by one.
                </p>`;
                combats.forEach((c, idx) => {
                    const isCurrent = idx === GameState.currentCombatIndex;
                    html += `<p style="text-align: center; font-size: 1rem; margin-bottom: 0.5rem; ${isCurrent ? 'font-weight: bold; color: #dc2626;' : 'color: #9ca3af;'}">
                        ${isCurrent ? '→ ' : ''}${c.enemyName} - SKILL ${c.enemySkill}, STAMINA ${c.enemyStamina}
                    </p>`;
                });
            } else {
                html += `<p style="text-align: center; font-size: 1.125rem; margin-bottom: 1rem;">
